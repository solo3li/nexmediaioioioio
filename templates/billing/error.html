{% extends 'base.html' %}

{% block title %}خطأ في عملية الدفع | NexMedia{% endblock %}

{% block content %}
<div style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="max-width: 520px; width: 100%; background: rgba(14, 25, 20, 0.95); border: 1px solid rgba(255, 87, 87, 0.4); border-radius: 16px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(12px); color: #FAF7F0; text-align: center;">
        
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: rgba(255, 87, 87, 0.15); border: 2px solid #FF5757; font-size: 32px; color: #FF5757; margin-bottom: 20px;">
            ⚠️
        </div>

        <h2 style="font-family: 'Amiri', 'Cinzel', serif; color: #FF5757; font-size: 24px; margin-bottom: 12px;">
            تعذر إتمام عملية الدفع
        </h2>
        <div style="background: rgba(255, 87, 87, 0.1); border-radius: 8px; padding: 14px; color: #FFA8A8; font-size: 14px; margin-bottom: 25px; word-break: break-all;">
            {{ error }}
        </div>

        <a href="/#pricing" style="display: inline-block; background: #C5A059; color: #0E2218; font-weight: bold; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-size: 15px;">
            العودة لجدول الباقات
        </a>
    </div>
</div>
{% endblock %}
