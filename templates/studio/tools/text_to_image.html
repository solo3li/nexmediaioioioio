{% extends 'studio/base_studio.html' %}

{% block tool_controls %}
<form id="t2i-form" onsubmit="event.preventDefault(); handleT2ISubmit();">
    
    <!-- Model Selection -->
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; color: #C5A059; margin-bottom: 8px; font-weight: bold;">
            نموذج الصور (Image Model)
        </label>
        <select id="t2i-model" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(197,160,89,0.4); border-radius: 8px; color: #FFF; font-size: 14px;">
            {% for m in models %}
            <option value="{{ m.model_id }}">{{ m.name }} ({{ m.provider }}) - {{ m.cost_per_image }} كريديت/صورة</option>
            {% empty %}
            <option value="grok-imagine">Grok Imagine Ultra (4.00 كريديت)</option>
            <option value="imagen-3-pro">Google Imagen 3 Pro (6.00 كريديت)</option>
            {% endfor %}
        </select>
    </div>

    <!-- Artistic Style Presets -->
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; color: #C5A059; margin-bottom: 8px; font-weight: bold;">
            النمط الفني (Style Preset)
        </label>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px;">
            <label style="background: rgba(14,58,31,0.08); border: 1.5px solid #0E3A1F; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; color: #0E3A1F; font-size: 12.5px; font-weight: bold;">
                <input type="radio" name="art_style" value="ultra_realistic" checked style="display: none;">
                واقعي عالي الدقة
            </label>
            <label style="background: #FAF7F0; border: 1.5px solid rgba(197,160,89,0.35); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; color: #362A1F; font-size: 12.5px;">
                <input type="radio" name="art_style" value="cinematic_photo" style="display: none;">
                فوتوغرافي سينمائي
            </label>
            <label style="background: #FAF7F0; border: 1.5px solid rgba(197,160,89,0.35); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; color: #362A1F; font-size: 12.5px;">
                <input type="radio" name="art_style" value="digital_masterpiece" style="display: none;">
                لوحة إعلانية وفنية
            </label>
        </div>
    </div>

    <!-- Prompt -->
    <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; color: #C5A059; margin-bottom: 8px; font-weight: bold;">
            وصف الصورة (Prompt)
        </label>
        <textarea id="t2i-prompt" required rows="4" placeholder="مثال: بورتريه فوتوغرافي واقعي بدقة 8K لرائد أعمال في مكتب حديث يطل على أفق المدينة ليلاً، إضاءة سينمائية دافئة، عمق ميدان ضحل (Bokeh)، وتفاصيل دقيقة للملامح والأقمشة..." style="width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(197,160,89,0.4); border-radius: 8px; color: #FFF; font-size: 14px; box-sizing: border-box; resize: vertical; line-height: 1.5;"></textarea>
    </div>

    <!-- Aspect Ratio -->
    <div style="margin-bottom: 25px;">
        <label style="display: block; font-size: 12.5px; color: #C5A059; margin-bottom: 8px;">الأبعاد والنسب (Aspect Ratio)</label>
        <div style="display: flex; gap: 8px;">
            <label style="flex: 1; text-align: center; background: rgba(197,160,89,0.2); border: 1px solid #C5A059; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #FFF; font-weight: bold;">
                <input type="radio" name="img_aspect" value="1:1" checked style="display: none;"> 1:1 مربع
            </label>
            <label style="flex: 1; text-align: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(197,160,89,0.3); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #FFF;">
                <input type="radio" name="img_aspect" value="16:9" style="display: none;"> 16:9 شاشة عريضة
            </label>
            <label style="flex: 1; text-align: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(197,160,89,0.3); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #FFF;">
                <input type="radio" name="img_aspect" value="9:16" style="display: none;"> 9:16 ستوري
            </label>
        </div>
    </div>

    <button type="submit" style="width: 100%; background: linear-gradient(135deg, #C5A059, #9E7D3B); color: #0E2218; font-weight: bold; font-size: 16px; padding: 16px; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 20px rgba(197,160,89,0.35);">
        توليد الصورة
    </button>

</form>

<script>
function handleT2ISubmit() {
    const prompt = document.getElementById('t2i-prompt').value;
    const model = document.getElementById('t2i-model').value;
    const style = document.querySelector('input[name="art_style"]:checked').value;
    const aspect = document.querySelector('input[name="img_aspect"]:checked').value;

    const fd = new FormData();
    fd.append('prompt', prompt);
    fd.append('model', model);
    fd.append('style', style);
    fd.append('aspect_ratio', aspect);

    submitGeneration(fd, 'text_to_image');
}
</script>
{% endblock %}
