{% extends 'studio/base_studio.html' %}

{% block tool_controls %}
<form id="avatar-form" onsubmit="event.preventDefault(); handleAvatarSubmit();">
    
    <!-- Avatar Character Selector -->
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; color: #C5A059; margin-bottom: 8px; font-weight: bold;">
            اختيار الشخصية الرقمية (Avatar Persona)
        </label>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;">
            <label style="background: rgba(14,58,31,0.08); border: 1.5px solid #0E3A1F; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; color: #0E3A1F; font-size: 12.5px; font-weight: bold; display: flex; flex-direction: column; align-items: center;">
                <input type="radio" name="avatar_char" value="hed-presenter-1" checked style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 6px;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                مقدم رسمي وقور
            </label>
            <label style="background: #FAF7F0; border: 1.5px solid rgba(197,160,89,0.35); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; color: #362A1F; font-size: 12.5px; display: flex; flex-direction: column; align-items: center;">
                <input type="radio" name="avatar_char" value="hed-presenter-2" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 6px;"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
                مقدمة برامج ذكية
            </label>
            <label style="background: #FAF7F0; border: 1.5px solid rgba(197,160,89,0.35); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; color: #362A1F; font-size: 12.5px; display: flex; flex-direction: column; align-items: center;">
                <input type="radio" name="avatar_char" value="hed-creative-1" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 6px;"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                صانع محتوى عصري
            </label>
        </div>
    </div>

    <!-- Script Text -->
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; color: #C5A059; margin-bottom: 8px; font-weight: bold;">
            نص الحوار أو الخطاب (Presenter Script)
        </label>
        <textarea id="avatar-script" required rows="4" placeholder="أدخل النص الذي ستلقيه الشخصية الافتراضية أمام الكاميرا بتعبيرات وحركات رأس طبيعية..." style="width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(197,160,89,0.4); border-radius: 8px; color: #FFF; font-size: 14px; box-sizing: border-box; resize: vertical; line-height: 1.5;"></textarea>
    </div>

    <!-- Expression Tone -->
    <div style="margin-bottom: 25px;">
        <label style="display: block; font-size: 12.5px; color: #C5A059; margin-bottom: 8px;">نبرة التعبيرات الجسدية والانفعالية</label>
        <div style="display: flex; gap: 8px;">
            <label style="flex: 1; text-align: center; background: rgba(197,160,89,0.2); border: 1px solid #C5A059; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #FFF; font-weight: bold;">
                <input type="radio" name="tone" value="formal" checked style="display: none;"> رسمي هادئ
            </label>
            <label style="flex: 1; text-align: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(197,160,89,0.3); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #FFF;">
                <input type="radio" name="tone" value="warm" style="display: none;"> دافئ ومشجع
            </label>
            <label style="flex: 1; text-align: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(197,160,89,0.3); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #FFF;">
                <input type="radio" name="tone" value="dynamic" style="display: none;"> حماسي تفاعلي
            </label>
        </div>
    </div>

    <button type="submit" style="width: 100%; background: linear-gradient(135deg, #C5A059, #9E7D3B); color: #0E2218; font-weight: bold; font-size: 16px; padding: 16px; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 20px rgba(197,160,89,0.35);">
        توليد فيديو الأفاتار
    </button>

</form>

<script>
function handleAvatarSubmit() {
    const script = document.getElementById('avatar-script').value;
    const character = document.querySelector('input[name="avatar_char"]:checked').value;
    const tone = document.querySelector('input[name="tone"]:checked').value;

    const fd = new FormData();
    fd.append('prompt', script);
    fd.append('character_id', character);
    fd.append('expression_tone', tone);

    submitGeneration(fd, 'avatar_video');
}
</script>
{% endblock %}
